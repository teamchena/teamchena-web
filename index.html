<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071523">
  <meta name="description" content="Sitio oficial del Club Social y Deportivo Team Chena Mountainbike.">
  <title>Team Chena | Sitio oficial</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{font-family:Arial,Helvetica,sans-serif;background:#081929;color:#fff}
    main{min-height:100svh;position:relative;display:flex;justify-content:center;align-items:center;
      padding:42px 24px;isolation:isolate;text-align:center;overflow:hidden}
    main::before{content:"";position:absolute;inset:0;z-index:-2;
      background-image:url("fondo-chena.jpg");background-position:center;background-size:cover}
    main::after{content:"";position:absolute;inset:0;z-index:-1;
      background:linear-gradient(180deg,rgba(2,11,20,.16),rgba(2,11,20,.42) 45%,rgba(2,11,20,.65))}
    .content{width:min(90vw,710px);display:flex;flex-direction:column;align-items:center}
    .logo{display:block;width:min(82vw,620px);height:auto;filter:drop-shadow(0 7px 22px rgba(0,0,0,.45))}
    .line{height:2px;width:48px;background:#fff;opacity:.88;margin:38px 0 26px}
    h1{font-size:clamp(13px,1.6vw,18px);line-height:1.6;letter-spacing:.24em;
       text-transform:uppercase;font-weight:700;margin:0 0 28px;text-shadow:0 2px 14px rgba(0,0,0,.7)}
    a{color:#fff;text-decoration:none;display:inline-flex;gap:12px;align-items:center;
      border:1px solid rgba(255,255,255,.75);padding:14px 21px;font-size:12px;
      font-weight:700;letter-spacing:.15em;text-transform:uppercase;
      background:rgba(3,16,30,.25);transition:background .2s,border-color .2s}
    a:hover,a:focus-visible{background:rgba(3,16,30,.85);border-color:#fff}
    a svg{height:20px;width:20px;fill:none;stroke:currentColor;stroke-width:2}
    .foot{position:absolute;bottom:22px;left:15px;right:15px;
      font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
      opacity:.9;text-shadow:0 2px 9px #000}
    @media(max-width:640px){
      main{padding:35px 18px}
      main::before{background-position:56% center}
      .logo{width:min(88vw,490px)}
      .line{margin:29px 0 23px}
      h1{font-size:12px;letter-spacing:.14em}
      .foot{font-size:9px;letter-spacing:.12em}
    }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <img class="logo" src="logo-team-chena.png" alt="Team Chena">
      <div class="line" aria-hidden="true"></div>
      <h1>Sitio oficial en construcción</h1>
      <a href="https://www.instagram.com/teamchena/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
          <circle cx="12" cy="12" r="4.2"/><circle cx="17.7" cy="6.6" r=".8" fill="currentColor" stroke="none"/>
        </svg>
        Instagram
      </a>
    </div>
    <div class="foot">Club Social y Deportivo Team Chena Mountainbike · San Bernardo, Chile</div>
  </main>
</body>
</html>
